<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#33a474" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACGTI 官网 - ACG Type Indicator | 二次元角色原型测试</title>
    <meta name="description" content="ACGTI 官网，ACG Type Indicator 二次元角色原型测试。回答 39 道情境式问题，测出属于你的角色代码，查看 MBTI 维度倾向与二次元角色原型解析。" />

    <!-- 静态 OG/Twitter 基础标签：多数社交爬虫不执行 JS，客户端 useSeo 只能覆盖会执行 JS 的场景 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ACGTI" />
    <meta property="og:title" content="ACGTI - ACG Type Indicator | 二次元角色原型测试" />
    <meta property="og:description" content="回答 39 道情境式问题，测出属于你的角色代码与二次元角色原型解析。免费、无需注册、不上传逐题答案。" />
    <meta property="og:url" content="https://binbilibili.github.io/ACGTI/" />
    <meta property="og:image" content="https://binbilibili.github.io/ACGTI/og-image.png" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ACGTI - ACG Type Indicator" />
    <meta name="twitter:description" content="二次元角色原型测试：39 道题，测出属于你的角色代码。" />
    <meta name="twitter:image" content="https://binbilibili.github.io/ACGTI/og-image.png" />

    <!-- 广告脚本由 src/utils/adsense.ts 在配置了 VITE_ADSENSE_CLIENT 时动态注入。
         上游在这里硬编码了原作者自己的 AdSense 账号，本分支已移除：
         直接用别人的账号既不对，也会让收益流向无关站点。 -->

    <style>
      /* ---------- Loading screen (pure CSS, no JS dependency) ---------- */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
      }
      #loading-screen.loaded {
        opacity: 0;
        pointer-events: none;
      }
      .ls-logo {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #eef2f4;
      }
      .ls-dot {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        animation: ls-pulse 1.4s ease-in-out infinite;
      }
      .ls-dot:nth-child(1) { top: 6px;  left: 20px; background: #e5b540; animation-delay: 0s; }
      .ls-dot:nth-child(2) { bottom: 6px; left: 20px; background: #4298b4; animation-delay: 0.2s; }
      .ls-dot:nth-child(3) { left: 6px;  top: 20px;  background: #8a609d; animation-delay: 0.4s; }
      .ls-dot:nth-child(4) { right: 6px; top: 20px;  background: #3ba17c; animation-delay: 0.6s; }
      .ls-brand {
        margin-top: 18px;
        font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
        font-size: 1.3rem;
        font-weight: 700;
        color: #333;
        letter-spacing: 0.08em;
      }
      @keyframes ls-pulse {
        0%, 100% { transform: scale(1);   opacity: 1; }
        50%      { transform: scale(0.5); opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <noscript>
      <p style="font-family: sans-serif; text-align: center; padding: 24px;">
        ACGTI 需要启用 JavaScript 才能运行，请在浏览器设置里打开后刷新本页。
      </p>
    </noscript>
    <div id="loading-screen">
      <div class="ls-logo">
        <span class="ls-dot"></span>
        <span class="ls-dot"></span>
        <span class="ls-dot"></span>
        <span class="ls-dot"></span>
      </div>
      <p class="ls-brand">ACGTI</p>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!-- Safety: force-dismiss loading screen after 5 s -->
    <script>
      setTimeout(function () {
        var el = document.getElementById('loading-screen');
        if (el && !el.classList.contains('loaded')) {
          el.classList.add('loaded');
          // 同步移除节点，避免读屏器继续朗读 loading 文案
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 600);
        }
      }, 5000);
    </script>
  </body>
</html>
